[project]
name = "video-role-play-backend"
version = "0.1.0"
description = "视频人声擦除/角色扮演后端（FastAPI + ML 推理）"
requires-python = ">=3.10,<3.11"
license = "MIT"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "pydantic==2.10.5",
  "httpx==0.28.1",
  # ML 推理（CPU-only；demucs 首次使用自动从公开地址下载权重）
  "torch==2.4.1+cpu",
  "torchaudio==2.4.1+cpu",
  "demucs==4.1.0",
  # demucs 4.1.0 运行必需但未声明；<2 兼容 torch 2.4.1
  "numpy==1.26.4",
  # 说话人分离（pyannote 为门控模型：首次使用需 HF token 并在线接受协议，下载后离线）
  "pyannote.audio==3.1.0",
  # pyannote.audio 3.1.0 生态锁定：huggingface_hub 1.x API 不兼容（异常签名变化），
  # 其余锁在与 pyannote 3.1 / numpy 1.x 同期版本，避免解析出 numpy 2 组合
  "huggingface_hub==0.25.2",
  "lightning==2.1.4",
  "speechbrain==0.5.16",
  "pyannote.core==5.0.0",
  "pyannote.metrics==3.2.1",
  "pyannote.pipeline==3.0.1",
  "scikit-learn==1.5.2",
  "scipy==1.13.1",
  # pyannote.audio 3.1.0 声明的推理依赖（--no-deps 或解析漂移时兜底锁定）
  "soundfile==0.14.0",
  "tensorboardx==2.6.5",
  "torch-audiomentations==0.12.0",
  "pytorch-metric-learning==2.9.0",
  # 样本转写（faster-whisper：权重托管在 HF 公开仓库，无需账号、非门控，
  # 首次使用自动下载后离线；英文优先，默认 base.en 模型）
  "faster-whisper==1.1.0",
  # faster-whisper 1.1.0 生态锁定：ctranslate2 <5、onnxruntime <2、tokenizers <1，
  # 均与 numpy 1.x 同期，避免解析出 numpy 2 组合
  "ctranslate2==4.8.2",
  "onnxruntime==1.23.2",
  "av==17.1.0",
  "tokenizers==0.23.2",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cpu"]
# 本项目不是可安装的包：run.py 通过 sys.path 直接运行 backend 源码，
# 只安装依赖、不把项目自身打包为 editable。
package = false
# uv 默认生成跨平台通用锁；demucs 4.1.0 在 macOS 上要求 torch<2.3，
# 与 torch==2.4.1+cpu 冲突，故仅解析 Linux/Windows（本项目运行于 WSL）。
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
